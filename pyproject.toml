[project]
name = "rfq-ingestion"
version = "0.1.0"
description = "Turns a raw RFQ email into structured data for the ERP."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "openai>=1.50,<2",
    "pypdf>=4.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
